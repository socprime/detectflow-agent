# Log4j2 configuration for local development (docker-compose) and K8s.
#
# PatternLayout for readable console output.
# INFO level for Flink core, WARN for noisy libraries.
#
# Note: For Kubernetes, logging is configured via spec.logConfiguration
# in FlinkDeployment manifest (detectflow-backend template). This file
# applies to the JM/TM containers' direct invocations (e.g., docker-compose).

# Root logger
rootLogger.level = INFO
rootLogger.appenderRef.console.ref = ConsoleAppender

# Console appender with readable pattern
appender.console.name = ConsoleAppender
appender.console.type = Console
appender.console.target = SYSTEM_OUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%t] %c{1.} - %m%n

# Flink core - INFO for checkpoint/state monitoring
logger.flink.name = org.apache.flink
logger.flink.level = INFO

# Kafka connector - WARN to reduce noise
logger.kafka.name = org.apache.kafka
logger.kafka.level = WARN

logger.kafkaShaded.name = org.apache.flink.kafka.shaded
logger.kafkaShaded.level = WARN

# Pekko/Akka networking - WARN
logger.pekko.name = org.apache.pekko
logger.pekko.level = WARN

# Py4J bridge - WARN
logger.py4j.name = py4j
logger.py4j.level = WARN

# Beam - WARN. Both jobs default to THREAD mode (Pemja, in-process); Beam is
# only on the classpath for the process-mode A/B path
# (CORRELATION_PYTHON_MODE=process).
logger.beam.name = org.apache.beam
logger.beam.level = WARN

# Suppress the per-checkpoint "Name collision: Group already contains a Metric
# with the name 'pendingCommittables'" WARN that the Kafka sink committer's
# metric group emits every checkpoint on both jobs — benign duplicate metric
# registration that otherwise floods the TM logs. The warning comes from the
# `org.apache.flink.metrics.MetricGroup` logger (shown as `o.a.f.m.MetricGroup`
# in the log pattern above), so only that logger is raised to ERROR and other
# framework warnings are unaffected. NB: on Kubernetes, logging is configured by
# detectflow-backend's FlinkDeployment.spec.logConfiguration (not this file) —
# mirror this suppression there.
logger.metricsGroup.name = org.apache.flink.metrics.MetricGroup
logger.metricsGroup.level = ERROR
