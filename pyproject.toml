[project]
name = "detectflow-agent"
version = "2.3.2"
description = "Flink-side of the Attack Chains — correlation-job (HoS matcher) + agent-job (LLM enrichment)"
requires-python = ">=3.11,<3.13"
authors = [
    {name = "Vladyslav Gumeniuk", email = "vladyslav.gumeniuk@socprime.com"}
]

# apache-flink 2.2.0 + apache-beam 2.61 do not yet ship wheels for 3.13/3.14.
# PyFlink is provided by extras — pick one per Dockerfile.
dependencies = [
    "confluent-kafka>=2.13.2",
    "python-dotenv>=1.2.1",
    "structlog>=25.4.0",
    "pydantic>=2.10.4",
    "pydantic-settings>=2.7.0",
    "pyyaml>=6.0",
]

# Per-job extras. Each Dockerfile installs exactly one. Local dev:
#   uv sync --all-extras   (full venv — both jobs importable for unit tests)
[project.optional-dependencies]
correlation = [
    "apache-flink==2.2.0",
]
agent = [
    "apache-flink==2.2.0",
    "flink-agents==0.2.0",
    # flink-agents 0.2.0 imports importlib_resources at module load but does
    # not declare it; chromadb used to pull it in transitively.
    "importlib-resources>=6.0.0",
    "openai>=2.0.0",
]

[project.scripts]
detectflow-correlation = "app.jobs.correlation.__main__:main"
detectflow-agent = "app.jobs.agent.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
managed = true              # Mark as uv-managed project
package = true              # Enable package management
default-groups = ["dev"]    # Auto-install dev dependencies
# apache-flink==2.2.0 → apache-beam<=2.61.0 → pyarrow<17.0.0
# pyarrow 16.x has known CVEs; override to a patched version.
override-dependencies = [
    "pyarrow>=18.0.0",
]
# chromadb is a hard pin of flink-agents 0.2.0 (optional ChromaVectorStore
# backend). We never construct it: agent-job calls the LLM directly. Every
# published chromadb through 1.5.9 is still affected by unpatched FastAPI-
# server RCEs (GHSA-36p7-vc44-83pf, GHSA-f4j7-r4q5-qw2c); drop it from the
# resolved graph so it is neither installed nor scanned.
exclude-dependencies = [
    "chromadb",
]
exclude-newer = "2026-10-23T00:00:00Z"  # Supply-chain cooldown: ignore releases newer than this

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -q -m 'not integration'"
markers = [
    "integration: end-to-end tests against a running docker-compose stack (use `pytest -m integration`)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

lint.select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]

lint.ignore = [
    "E501",  # line too long (handled by formatter)
]

# Per-file relaxations:
#   - tests use snake_case but sometimes embed acronyms / API tokens like
#     `seqN`, `keyId` for readability — N802 (lowercase function names)
#     here is noisy.
#   - tests/operators/test_chain_models.py asserts a generic Exception is
#     raised by Pydantic in a forward-compat case (B017) — intentional.
#   - tests/operators/test_chain_record.py uses zip() over equal-length
#     buffer/event arrays (B905) — strict mode would trip false positives
#     when the chain layout legitimately changes mid-test.
lint.per-file-ignores = { "tests/**/*.py" = ["N802", "B017", "B905"] }

format.quote-style = "double"
format.indent-style = "space"
